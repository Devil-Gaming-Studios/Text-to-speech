<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Text to speech</title>
<style>
  :root {
    --bg: #faf9f6;
    --panel: #ffffff;
    --border: #e2e0d8;
    --border-strong: #c9c6ba;
    --text: #1f1e1a;
    --text-secondary: #6b6a63;
    --accent: #b5502e;
    --accent-soft: #f3e3db;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 16px;
    display: flex;
    justify-content: center;
  }
  .wrap {
    width: 100%;
    max-width: 640px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .sub {
    font-size: 14px;
    color: var(--text-secondary);
    margin: 0 0 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  textarea {
    width: 100%;
    min-height: 160px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-size: 15px;
    line-height: 1.6;
    font-family: inherit;
    color: var(--text);
    background: var(--bg);
  }
  textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  .row {
    display: flex;
    gap: 12px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .field {
    flex: 1;
    min-width: 140px;
  }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }
  select {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    font-size: 14px;
    color: var(--text);
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
  }
  .slider-val {
    font-size: 13px;
    color: var(--text-secondary);
    width: 32px;
    text-align: right;
  }
  .controls {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  button {
    border: 1px solid var(--border-strong);
    background: var(--panel);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text);
  }
  button:hover { background: var(--accent-soft); border-color: var(--accent); }
  button:active { transform: scale(0.98); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.primary:hover { background: #9c4526; }
  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .status {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 12px;
    min-height: 18px;
  }
  .charcount {
    font-size: 12px;
    color: var(--text-secondary);
    text-align: right;
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Text to speech</h1>
  <p class="sub">Paste or type text, pick a voice, and listen. Runs entirely in your browser.</p>

  <div class="card">
    <textarea id="text" placeholder="Type or paste the text you want read aloud...">Hello! This is a simple text to speech converter. You can paste any text here, choose a voice, adjust the speed and pitch, and hit play.</textarea>
    <div class="charcount" id="charcount">0 characters</div>

    <div class="row">
      <div class="field">
        <label for="voice">Voice</label>
        <select id="voice"></select>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Speed (<span id="rateVal">1.0</span>x)</label>
        <div class="slider-row">
          <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
        </div>
      </div>
      <div class="field">
        <label>Pitch (<span id="pitchVal">1.0</span>)</label>
        <div class="slider-row">
          <input type="range" id="pitch" min="0" max="2" step="0.1" value="1">
        </div>
      </div>
      <div class="field">
        <label>Volume (<span id="volVal">100</span>%)</label>
        <div class="slider-row">
          <input type="range" id="volume" min="0" max="1" step="0.05" value="1">
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="primary" id="playBtn">Play</button>
      <button id="pauseBtn" disabled>Pause</button>
      <button id="stopBtn" disabled>Stop</button>
    </div>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
  const textEl = document.getElementById('text');
  const voiceEl = document.getElementById('voice');
  const rateEl = document.getElementById('rate');
  const pitchEl = document.getElementById('pitch');
  const volumeEl = document.getElementById('volume');
  const rateVal = document.getElementById('rateVal');
  const pitchVal = document.getElementById('pitchVal');
  const volVal = document.getElementById('volVal');
  const playBtn = document.getElementById('playBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const stopBtn = document.getElementById('stopBtn');
  const statusEl = document.getElementById('status');
  const charcount = document.getElementById('charcount');

  const synth = window.speechSynthesis;
  let voices = [];
  let utterance = null;

  function updateCharCount() {
    charcount.textContent = textEl.value.length + ' characters';
  }
  textEl.addEventListener('input', updateCharCount);
  updateCharCount();

  function populateVoices() {
    voices = synth.getVoices();
    voiceEl.innerHTML = '';
    if (voices.length === 0) {
      const opt = document.createElement('option');
      opt.textContent = 'Loading voices...';
      voiceEl.appendChild(opt);
      return;
    }
    voices.forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = v.name + ' (' + v.lang + ')' + (v.default ? ' — default' : '');
      voiceEl.appendChild(opt);
    });
    const defaultIdx = voices.findIndex(v => v.default);
    if (defaultIdx >= 0) voiceEl.value = defaultIdx;
  }

  populateVoices();
  if (synth.onvoiceschanged !== undefined) {
    synth.onvoiceschanged = populateVoices;
  }

  rateEl.addEventListener('input', () => rateVal.textContent = parseFloat(rateEl.value).toFixed(1));
  pitchEl.addEventListener('input', () => pitchVal.textContent = parseFloat(pitchEl.value).toFixed(1));
  volumeEl.addEventListener('input', () => volVal.textContent = Math.round(volumeEl.value * 100));

  function setPlayingState(isPlaying) {
    playBtn.disabled = isPlaying;
    pauseBtn.disabled = !isPlaying;
    stopBtn.disabled = !isPlaying;
  }

  playBtn.addEventListener('click', () => {
    const text = textEl.value.trim();
    if (!text) {
      statusEl.textContent = 'Enter some text first.';
      return;
    }
    if (synth.paused && utterance) {
      synth.resume();
      setPlayingState(true);
      statusEl.textContent = 'Speaking...';
      return;
    }
    synth.cancel();
    utterance = new SpeechSynthesisUtterance(text);
    const selectedVoice = voices[voiceEl.value];
    if (selectedVoice) utterance.voice = selectedVoice;
    utterance.rate = parseFloat(rateEl.value);
    utterance.pitch = parseFloat(pitchEl.value);
    utterance.volume = parseFloat(volumeEl.value);

    utterance.onstart = () => { setPlayingState(true); statusEl.textContent = 'Speaking...'; };
    utterance.onend = () => { setPlayingState(false); statusEl.textContent = 'Finished.'; };
    utterance.onerror = (e) => { setPlayingState(false); statusEl.textContent = 'Error: ' + e.error; };

    synth.speak(utterance);
  });

  pauseBtn.addEventListener('click', () => {
    if (synth.speaking && !synth.paused) {
      synth.pause();
      setPlayingState(false);
      playBtn.disabled = false;
      statusEl.textContent = 'Paused.';
    }
  });

  stopBtn.addEventListener('click', () => {
    synth.cancel();
    setPlayingState(false);
    statusEl.textContent = 'Stopped.';
  });
</script>
</body>
</html>
